<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Dopa — coffee for the moon</title>
  <desc>SVG concept based on the supplied composition reference: a large crescent at lower left and a tilted ceramic cup at upper right. Coffee curves over the lip, falls downward, and drapes across the inner edge of the moon, with one rounded drop beside it. Separate editable background, moon, cup, and coffee groups. No embedded images or glass effects.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#4C4DB3"/>
      <stop offset="1" stop-color="#171B53"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#E1F8FF"/>
      <stop offset="1" stop-color="#8EBFFF"/>
    </linearGradient>
    <linearGradient id="ceramic" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop stop-color="#FFFAEF"/>
      <stop offset="1" stop-color="#E8D7B9"/>
    </linearGradient>
    <linearGradient id="coffee" gradientUnits="userSpaceOnUse" x1="495" y1="335" x2="495" y2="710">
      <stop stop-color="#70422D"/>
      <stop offset="0.2" stop-color="#9C5E36"/>
      <stop offset="1" stop-color="#844A2C"/>
    </linearGradient>
  </defs>
  <g id="background-layer">
    <path fill="url(#background)" d="M0 0H1024V1024H0Z"/>
  </g>
  <g id="moon-layer">
    <path fill="url(#moon)" d="M439 239C293 252 180 382 179 528C175 715 323 866 516 867C659 868 781 769 816 631C821 612 809 602 795 613C705 682 619 693 531 653C403 596 334 499 351 376C359 316 395 279 440 247C449 240 446 237 439 239Z"/>
  </g>
