    <path id="cup-body" fill="url(#ceramic)" d="M631 181C633 168 636 158 639.63 154.09C650 154.09 671 160.2 680 152.62C718 177 779 247 815 282C855 310 850 343 832 383C811 431 775 478 735 503C710 520 688.84 515.41 663 510C620 501 544 456 478 409C502 368 557 273 631 181Z"/>
