name: Release

on:
  release:
    types: [published, released]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  publish-release-assets:
    runs-on: macos-26
    permissions:
      contents: write
    concurrency:
      group: dopa-release-assets-${{ github.event.release.tag_name }}
      cancel-in-progress: false
    outputs:
      app-archive: ${{ steps.published-assets.outputs.app-archive }}
      app-sha256: ${{ steps.published-assets.outputs.app-sha256 }}
      bundle-name: ${{ steps.published-assets.outputs.bundle-name }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Check out the released source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the release tag
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::Release tag must have the form vX.Y.Z: ${RELEASE_TAG}"
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "${RELEASE_SHA}" ]] || {
            echo "::error::Checked-out commit does not match the release event SHA"
            exit 1
          }
          [[ "$(git rev-list -n 1 "${RELEASE_TAG}")" == "${RELEASE_SHA}" ]] || {
            echo "::error::${RELEASE_TAG} moved after the release event; refusing to build a different commit"
            exit 1
          }
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "${RELEASE_SHA}" origin/main || {
            echo "::error::Stable releases must point to a commit on main"
            exit 1
          }

      - name: Install the locked toolchain
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true

      - name: Validate the complete release inventory
        run: |
          set -euo pipefail
          make release-check

      - name: Reuse a complete verified asset set when available
        id: asset-preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          app_archive=$(mise exec -- python -c \
            'import json; print(json.load(open("release/artifacts.json"))["appArchive"])')
          cli_archive=$(mise exec -- python -c \
            'import json; print(json.load(open("release/artifacts.json"))["cliArchive"])')
          homebrew_cask=$(mise exec -- python -c \
            'import json; print(json.load(open("release/artifacts.json"))["homebrewCask"])')
          printf '%s\n' \
            "${app_archive}" \
            "${cli_archive}" \
            "${homebrew_cask}" \
            release-manifest.json \
            SHA256SUMS | LC_ALL=C sort >expected-assets.txt
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json assets --jq '.assets[].name' | LC_ALL=C sort >published-assets.txt
          if diff -q expected-assets.txt published-assets.txt >/dev/null; then
            published_dir="${RUNNER_TEMP}/preflight-published-assets"
            mkdir -p "${published_dir}"
            gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --dir "${published_dir}"
            mise exec -- python scripts/verify_published_release.py \
              "${RELEASE_TAG}" "${published_dir}"
            echo "reuse=true" >>"${GITHUB_OUTPUT}"
          else
            echo "reuse=false" >>"${GITHUB_OUTPUT}"
          fi

      - name: Test and build every distributable
        if: ${{ steps.asset-preflight.outputs.reuse != 'true' }}
        run: |
          set -euo pipefail
          make check app
          signed_items=(.build/Dopa.app)
          while IFS= read -r bundle_path; do
            signed_items+=(".build/Dopa.app/${bundle_path}")
          done < <(mise exec -- python -c '
          import json
          products = json.load(open("release/artifacts.json"))["products"]
          print("\n".join(product["bundlePath"] for product in products))
          ')
          for signed_item in "${signed_items[@]}"; do
            signature=$(codesign -dvvv "${signed_item}" 2>&1)
            grep -F 'Signature=adhoc' <<<"${signature}"
            grep -E 'flags=.*\([^)]*runtime' <<<"${signature}"
            if grep -Fq 'Authority=' <<<"${signature}"; then
              echo "::error::${signed_item} unexpectedly uses a signing identity"
              exit 1
            fi
          done

      - name: Package and verify release assets
        if: ${{ steps.asset-preflight.outputs.reuse != 'true' }}
        run: |
          set -euo pipefail
          ./scripts/package-release.sh "${RELEASE_TAG}"

      - name: Publish or reuse the complete verified asset set
        id: published-assets
        env:
          GH_TOKEN: ${{ github.token }}
          ASSETS_REUSABLE: ${{ steps.asset-preflight.outputs.reuse }}
        run: |
          set -euo pipefail
          app_archive=$(mise exec -- python -c \
            'import json; print(json.load(open("release/artifacts.json"))["appArchive"])')
          cli_archive=$(mise exec -- python -c \
            'import json; print(json.load(open("release/artifacts.json"))["cliArchive"])')
          homebrew_cask=$(mise exec -- python -c \
            'import json; print(json.load(open("release/artifacts.json"))["homebrewCask"])')
          bundle_name=$(mise exec -- python -c \
            'import json; print(json.load(open("release/artifacts.json"))["bundleName"])')
          printf '%s\n' \
            "${app_archive}" \
            "${cli_archive}" \
            "${homebrew_cask}" \
            release-manifest.json \
            SHA256SUMS | LC_ALL=C sort >expected-assets.txt
          assets=()
          if [[ "${ASSETS_REUSABLE}" != true ]]; then
            assets=(dist/*)
            [[ -e "${assets[0]}" ]] || {
              echo "::error::The release packager produced no assets"
              exit 1
            }
            for asset in "${assets[@]}"; do basename "${asset}"; done \
              | LC_ALL=C sort >packaged-assets.txt
            diff -u expected-assets.txt packaged-assets.txt
          fi

          marker_name=dopa-release-upload-in-progress.txt
          {
            cat expected-assets.txt
            echo "${marker_name}"
          } | LC_ALL=C sort >transaction-assets.txt
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json assets --jq '.assets[].name' | LC_ALL=C sort >published-assets.txt

          if grep -Fxq "${marker_name}" published-assets.txt; then
            unexpected=$(comm -23 published-assets.txt transaction-assets.txt)
            if [[ -n "${unexpected}" ]]; then
              echo "::error::The interrupted upload also contains unexpected assets: ${unexpected}"
              exit 1
            fi
            while IFS= read -r published_asset; do
              [[ "${published_asset}" == "${marker_name}" ]] && continue
              gh release delete-asset "${RELEASE_TAG}" "${published_asset}" \
                --yes --repo "${GITHUB_REPOSITORY}"
            done <published-assets.txt
            # The marker is the proof that every other asset in this set is
            # safe for automatic recovery. Delete it only after all data
            # assets, so an interrupted cleanup remains recoverable.
            gh release delete-asset "${RELEASE_TAG}" "${marker_name}" \
              --yes --repo "${GITHUB_REPOSITORY}"
            : >published-assets.txt
          fi

          if [[ -s published-assets.txt ]]; then
            if ! diff -u expected-assets.txt published-assets.txt; then
              echo "::error::The release has a partial or unexpected asset set without an upload transaction marker. Refusing to replace it."
              exit 1
            fi
            published_dir="${RUNNER_TEMP}/published-release-assets"
            mkdir -p "${published_dir}"
            gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --dir "${published_dir}"
            (cd "${published_dir}" && shasum -a 256 -c SHA256SUMS)
          else
            marker_path="${RUNNER_TEMP}/${marker_name}"
            printf 'workflow=%s\nrun=%s\n' "${GITHUB_WORKFLOW}" "${GITHUB_RUN_ID}" \
              >"${marker_path}"
            gh release upload "${RELEASE_TAG}" "${marker_path}" --repo "${GITHUB_REPOSITORY}"
            # Leave the marker behind if this non-atomic upload is interrupted.
            # A retry can then prove that the partial set belongs to this workflow.
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}"
            gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --json assets --jq '.assets[].name' | LC_ALL=C sort >published-assets.txt
            if ! diff -u transaction-assets.txt published-assets.txt; then
              echo "::error::The upload transaction did not publish the complete asset set"
              exit 1
            fi
            gh release delete-asset "${RELEASE_TAG}" "${marker_name}" \
              --yes --repo "${GITHUB_REPOSITORY}"
            gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --json assets --jq '.assets[].name' | LC_ALL=C sort >published-assets.txt
            diff -u expected-assets.txt published-assets.txt
            published_dir=dist
          fi

          mise exec -- python scripts/verify_published_release.py \
            "${RELEASE_TAG}" "${published_dir}"
          app_sha=$(shasum -a 256 "${published_dir}/${app_archive}" | awk '{print $1}')
          echo "app-archive=${app_archive}" >>"${GITHUB_OUTPUT}"
          echo "app-sha256=${app_sha}" >>"${GITHUB_OUTPUT}"
          echo "bundle-name=${bundle_name}" >>"${GITHUB_OUTPUT}"

  validate-homebrew:
    if: ${{ !github.event.release.prerelease }}
    needs: publish-release-assets
    runs-on: macos-26
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.tap-update.outputs.changed }}
      branch: ${{ steps.tap-update.outputs.branch }}
      cask-base64: ${{ steps.tap-update.outputs.cask-base64 }}
      cask-sha256: ${{ steps.tap-update.outputs.cask-sha256 }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_SHA: ${{ github.sha }}
      APP_ARCHIVE: ${{ needs.publish-release-assets.outputs.app-archive }}
      APP_SHA256: ${{ needs.publish-release-assets.outputs.app-sha256 }}
      BUNDLE_NAME: ${{ needs.publish-release-assets.outputs.bundle-name }}
    steps:
      - name: Check out the released source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the release metadata
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "${APP_ARCHIVE}" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*\.zip$ ]]
          [[ "${APP_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${BUNDLE_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*\.app$ ]]
          [[ "$(git rev-parse HEAD)" == "${RELEASE_SHA}" ]]
          [[ "$(git rev-list -n 1 "${RELEASE_TAG}")" == "${RELEASE_SHA}" ]]
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "${RELEASE_SHA}" origin/main || {
            echo "::error::Stable releases must point to a commit on main"
            exit 1
          }

      - name: Install the locked toolchain
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true

      - name: Clone the public Homebrew tap for verification
        run: |
          set -euo pipefail
          git clone --no-tags https://github.com/gw31415/homebrew-tap.git homebrew-tap

      - name: Prepare and test the Homebrew Cask update
        if: ${{ !github.event.release.prerelease }}
        id: tap-update
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          reject_downgrade() {
            local cask_path=$1
            local source_name=$2
            local current_version
            current_version=$(sed -n 's/^  version "\([0-9][0-9.]*\)"$/\1/p' \
              "${cask_path}")
            [[ "${current_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "::error::Cannot read the Cask version from ${source_name}"
              exit 1
            }
            if ! mise exec -- python -c '
          import sys
          current = tuple(map(int, sys.argv[1].split(".")))
          released = tuple(map(int, sys.argv[2].split(".")))
          raise SystemExit(current > released)
          ' "${current_version}" "${version}"; then
              echo "::error::Refusing to downgrade the Cask from ${current_version} to ${version} (${source_name})"
              exit 1
            fi
          }

          if [[ -f homebrew-tap/Casks/dopa.rb ]]; then
            reject_downgrade homebrew-tap/Casks/dopa.rb main
          fi
          pending_cask="${RUNNER_TEMP}/pending-dopa.rb"
          if git -C homebrew-tap show \
            origin/automation/dopa-release:Casks/dopa.rb >"${pending_cask}" 2>/dev/null; then
            reject_downgrade "${pending_cask}" origin/automation/dopa-release
          fi
          ./scripts/render-homebrew-cask.sh \
            "${version}" "${APP_SHA256}" homebrew-tap/Casks/dopa.rb
          ruby -c homebrew-tap/Casks/dopa.rb
          grep -F 'Dopa is ad-hoc signed without a Developer ID and is not notarized by Apple.' \
            homebrew-tap/Casks/dopa.rb
          grep -F 'System Settings > Privacy & Security > Open Anyway' \
            homebrew-tap/Casks/dopa.rb
          grep -F 'xattr -dr com.apple.quarantine "#{appdir}/Dopa.app"' \
            homebrew-tap/Casks/dopa.rb
          grep -F "Do not use a wildcard" homebrew-tap/Casks/dopa.rb
          if grep -Eq '^[[:space:]]*(no_)?quarantine([[:space:]]|$)' \
            homebrew-tap/Casks/dopa.rb; then
            echo "::error::The Cask must not disable or remove quarantine"
            exit 1
          fi

          branch=automation/dopa-release
          changed=false
          if [[ -n "$(git -C homebrew-tap status --porcelain -- Casks/dopa.rb)" ]]; then
            git -C homebrew-tap config user.name "github-actions[bot]"
            git -C homebrew-tap config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"
            git -C homebrew-tap config commit.gpgsign false
            git -C homebrew-tap switch -C "${branch}"
            git -C homebrew-tap add Casks/dopa.rb
            git -C homebrew-tap commit -m "dopa ${version}"
            changed=true
          fi

          # Homebrew clones this local repository, so commit the generated Cask
          # before tapping it. The branch is pushed only after every check passes.
          brew tap gw31415/tap "${GITHUB_WORKSPACE}/homebrew-tap"
          (cd homebrew-tap && script/check)
          installed_app="/Applications/${BUNDLE_NAME}"
          cask_installed=false
          app_executable=
          cleanup_cask_test() {
            if [[ -n "${app_executable}" ]]; then
              pkill -TERM -x "${app_executable}" 2>/dev/null || true
            fi
            if [[ "${cask_installed}" == true ]]; then
              brew uninstall --cask gw31415/tap/dopa >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_cask_test EXIT

          install_log="${RUNNER_TEMP}/dopa-brew-install.log"
          brew install --cask gw31415/tap/dopa 2>&1 | tee "${install_log}"
          cask_installed=true
          grep -F 'Dopa is ad-hoc signed without a Developer ID and is not notarized by Apple.' \
            "${install_log}"
          grep -F 'System Settings > Privacy & Security > Open Anyway' "${install_log}"
          grep -F 'xattr -dr com.apple.quarantine "/Applications/Dopa.app"' "${install_log}"
          grep -F 'Do not use a wildcard' "${install_log}"

          test -d "${installed_app}"
          quarantine=$(xattr -p com.apple.quarantine "${installed_app}" 2>/dev/null || true)
          [[ -n "${quarantine}" ]] || {
            echo "::error::Homebrew installation did not preserve quarantine on ${installed_app}"
            exit 1
          }

          signature=$(codesign -dvvv "${installed_app}" 2>&1)
          grep -F 'Signature=adhoc' <<<"${signature}"
          grep -E 'flags=.*\([^)]*runtime' <<<"${signature}"
          if grep -Fq 'Authority=' <<<"${signature}"; then
            echo "::error::${installed_app} unexpectedly uses a signing identity"
            exit 1
          fi
          while IFS= read -r product_path; do
            signed_item="${installed_app}/${product_path}"
            test -x "${signed_item}"
            signature=$(codesign -dvvv "${signed_item}" 2>&1)
            grep -F 'Signature=adhoc' <<<"${signature}"
            grep -E 'flags=.*\([^)]*runtime' <<<"${signature}"
            if grep -Fq 'Authority=' <<<"${signature}"; then
              echo "::error::${signed_item} unexpectedly uses a signing identity"
              exit 1
            fi
          done < <(mise exec -- python -c '
          import json
          products = json.load(open("release/artifacts.json"))["products"]
          print("\n".join(product["bundlePath"] for product in products))
          ')

          # The public Cask leaves Gatekeeper quarantine intact. For execution
          # testing, perform the same explicit, app-scoped opt-in documented to users.
          xattr -dr com.apple.quarantine "${installed_app}"
          if xattr -lr "${installed_app}" 2>/dev/null \
            | grep -Fq 'com.apple.quarantine:'; then
            echo "::error::Quarantine remains after the explicit Dopa-only opt-in"
            exit 1
          fi

          while IFS= read -r cli; do
            cli_path=$(command -v "${cli}")
            test -x "${cli_path}"
            "${cli_path}" --help >/dev/null
          done < <(mise exec -- python -c '
          import json
          products = json.load(open("release/artifacts.json"))["products"]
          print("\n".join(product["name"] for product in products if product["classification"] == "cli"))
          ')

          app_executable=$(plutil -extract CFBundleExecutable raw -o - \
            "${installed_app}/Contents/Info.plist")
          open "${installed_app}"
          launched=0
          for _ in {1..20}; do
            if pgrep -x "${app_executable}" >/dev/null; then
              launched=1
              break
            fi
            sleep 0.5
          done
          [[ "${launched}" == 1 ]] || {
            echo "::error::Dopa.app did not stay running"
            exit 1
          }
          pkill -TERM -x "${app_executable}"
          brew uninstall --cask gw31415/tap/dopa
          cask_installed=false
          trap - EXIT

          if [[ "${changed}" == true ]]; then
            cask_path=homebrew-tap/Casks/dopa.rb
            cask_sha=$(shasum -a 256 "${cask_path}" | awk '{print $1}')
            cask_base64=$(base64 <"${cask_path}" | tr -d '\n')
            [[ "${cask_sha}" =~ ^[0-9a-f]{64}$ ]]
            [[ "${cask_base64}" =~ ^[A-Za-z0-9+/=]+$ ]]
            echo "changed=true" >>"${GITHUB_OUTPUT}"
            echo "branch=${branch}" >>"${GITHUB_OUTPUT}"
            echo "cask-sha256=${cask_sha}" >>"${GITHUB_OUTPUT}"
            echo "cask-base64=${cask_base64}" >>"${GITHUB_OUTPUT}"
          else
            echo "changed=false" >>"${GITHUB_OUTPUT}"
          fi

  update-homebrew:
    if: ${{ !github.event.release.prerelease && needs.validate-homebrew.outputs.changed == 'true' }}
    needs: validate-homebrew
    runs-on: macos-26
    environment: homebrew-release
    permissions:
      contents: read
      id-token: write
    concurrency:
      # Only credentialed tap publication is global. Validation jobs remain
      # independent; this fresh job rechecks the latest tap state before push.
      group: dopa-homebrew-tap
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      TAP_BRANCH: ${{ needs.validate-homebrew.outputs.branch }}
      CASK_BASE64: ${{ needs.validate-homebrew.outputs.cask-base64 }}
      CASK_SHA256: ${{ needs.validate-homebrew.outputs.cask-sha256 }}
    steps:
      # This job intentionally has no source checkout and executes no release
      # binary or tap script. The OIDC capability exists only on this fresh
      # runner, which treats the validated Cask as inert data.
      - name: Prepare the verified Cask on the latest tap
        id: prepare-push
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "${TAP_BRANCH}" == automation/dopa-release ]]
          [[ "${CASK_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${CASK_BASE64}" =~ ^[A-Za-z0-9+/=]+$ ]]
          (( ${#CASK_BASE64} <= 65536 ))

          git clone --no-tags https://github.com/gw31415/homebrew-tap.git homebrew-tap
          if [[ -L homebrew-tap/Casks ]] \
            || [[ -e homebrew-tap/Casks && ! -d homebrew-tap/Casks ]]; then
            echo "::error::The tap Casks path must be a real directory"
            exit 1
          fi
          mkdir -p homebrew-tap/Casks
          if [[ -L homebrew-tap/Casks/dopa.rb ]] \
            || [[ -e homebrew-tap/Casks/dopa.rb && ! -f homebrew-tap/Casks/dopa.rb ]]; then
            echo "::error::The tap dopa.rb path must be a regular file"
            exit 1
          fi
          printf '%s' "${CASK_BASE64}" \
            | base64 --decode >homebrew-tap/Casks/dopa.rb
          [[ -f homebrew-tap/Casks/dopa.rb && ! -L homebrew-tap/Casks/dopa.rb ]]
          actual_sha=$(shasum -a 256 homebrew-tap/Casks/dopa.rb | awk '{print $1}')
          [[ "${actual_sha}" == "${CASK_SHA256}" ]]

          version=${RELEASE_TAG#v}
          grep -Fx "  version \"${version}\"" homebrew-tap/Casks/dopa.rb
          grep -F 'Dopa is ad-hoc signed without a Developer ID and is not notarized by Apple.' \
            homebrew-tap/Casks/dopa.rb
          grep -F 'xattr -dr com.apple.quarantine "#{appdir}/Dopa.app"' \
            homebrew-tap/Casks/dopa.rb
          if grep -Eq '^[[:space:]]*(no_)?quarantine([[:space:]]|$)' \
            homebrew-tap/Casks/dopa.rb; then
            echo "::error::The Cask must not disable or remove quarantine"
            exit 1
          fi

          reject_downgrade() {
            local cask_path=$1
            local source_name=$2
            local current_version current_major current_minor current_patch
            local released_major released_minor released_patch
            current_version=$(sed -n 's/^  version "\([0-9][0-9.]*\)"$/\1/p' \
              "${cask_path}")
            [[ "${current_version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
              echo "::error::Cannot read the Cask version from ${source_name}"
              exit 1
            }
            IFS=. read -r current_major current_minor current_patch <<<"${current_version}"
            IFS=. read -r released_major released_minor released_patch <<<"${version}"
            if (( 10#${current_major} > 10#${released_major} \
              || (10#${current_major} == 10#${released_major} \
                && 10#${current_minor} > 10#${released_minor}) \
              || (10#${current_major} == 10#${released_major} \
                && 10#${current_minor} == 10#${released_minor} \
                && 10#${current_patch} > 10#${released_patch}) )); then
              echo "::error::Refusing to downgrade the Cask from ${current_version} to ${version} (${source_name})"
              exit 1
            fi
          }

          if git -C homebrew-tap show HEAD:Casks/dopa.rb \
            >"${RUNNER_TEMP}/main-dopa.rb" 2>/dev/null; then
            reject_downgrade "${RUNNER_TEMP}/main-dopa.rb" main
          fi
          if git -C homebrew-tap show \
            "origin/${TAP_BRANCH}:Casks/dopa.rb" \
            >"${RUNNER_TEMP}/pending-dopa.rb" 2>/dev/null; then
            reject_downgrade "${RUNNER_TEMP}/pending-dopa.rb" "origin/${TAP_BRANCH}"
          fi

          if [[ -z "$(git -C homebrew-tap status --porcelain -- Casks/dopa.rb)" ]]; then
            echo "changed=false" >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap config commit.gpgsign false
          git -C homebrew-tap switch -C "${TAP_BRANCH}"
          git -C homebrew-tap add Casks/dopa.rb
          git -C homebrew-tap commit -m "dopa ${version}"
          echo "changed=true" >>"${GITHUB_OUTPUT}"

      # Mint the cross-repository credential only after the fresh publication
      # job has materialized and checked the Cask as data.
      - name: Mint a short-lived Homebrew tap token
        if: ${{ steps.prepare-push.outputs.changed == 'true' }}
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: gw31415/homebrew-tap
          identity: dopa-release

      - name: Push the tap update
        if: ${{ steps.prepare-push.outputs.changed == 'true' }}
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push --force-with-lease --set-upstream origin \
            "HEAD:refs/heads/${TAP_BRANCH}"

      - name: Publish the verified release status
        if: ${{ steps.prepare-push.outputs.changed == 'true' }}
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          head_sha=$(git rev-parse HEAD)
          gh api --method POST \
            "repos/gw31415/homebrew-tap/statuses/${head_sha}" \
            -f state=success \
            -f context=dopa/release-verified \
            -f description="Dopa ${version} release and Cask verified on macOS" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Open or reuse the Homebrew tap pull request
        if: ${{ steps.prepare-push.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          body=$(cat <<EOF
          ## Dopa ${version}

          - Official release: https://github.com/gw31415/dopa/releases/tag/${RELEASE_TAG}
          - macOS verification: the release workflow installed the Cask with quarantine intact, verified every inventoried executable was ad-hoc signed with hardened runtime and no signing identity, explicitly removed quarantine from Dopa.app only, launched the app, ran every inventoried CLI help command, and uninstalled the Cask successfully.
          - The archive checksum is generated from the verified release asset.

          Generated automatically by gw31415/dopa release workflow.
          EOF
          )
          existing_url=$(gh pr list --repo gw31415/homebrew-tap --state open \
            --head "${TAP_BRANCH}" --json url --jq '.[0].url // empty')
          if [[ -n "${existing_url}" ]]; then
            gh pr edit "${existing_url}" --repo gw31415/homebrew-tap \
              --title "dopa ${version}" --body "${body}"
            printf 'Updated existing Homebrew pull request: %s\n' "${existing_url}"
            pull_request_url=${existing_url}
          else
            pull_request_url=$(gh pr create --repo gw31415/homebrew-tap \
              --base main --head "${TAP_BRANCH}" \
              --title "dopa ${version}" --body "${body}")
          fi
          gh pr merge "${pull_request_url}" --repo gw31415/homebrew-tap \
            --auto --squash
